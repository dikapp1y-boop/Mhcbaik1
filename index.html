<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Koperasi SMK Muthia Harapan Cicalengka</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            

            <h1>Login</h1>

            <p class="subtitle">
                Koperasi SMK Muthia Harapan Cicalengka
            </p>

            <form>

                <div class="input-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        required
                    >
                </div>

                <button  a hreftype= "submit">
                    Login
                </button>

            </form>

            <a href="index.html" class="kembali">
                ← Kembali ke Beranda
            </a>

        </div>

    </div>

</body>
</html>
